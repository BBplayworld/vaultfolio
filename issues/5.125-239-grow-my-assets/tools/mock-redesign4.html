<script id="mk-script">
// 데모 값: redesign.md 4-6·4-7(데모 JSON 시세, USD 1,400원, 11/18 기준). 3차 구현(cb36907) 모양을 따른다(행 둘째 줄 `기간 · N점`).
function renderMock(root, opts = {}) {
  const S = [ // 오래 가진 순
    { name: "TIGER 미국S&P500", hold: "2년 2개월", score: "3점", pl: 315000, cost: 1890000, label: "keep", re: true },
    { name: "삼성전자", hold: "1년 8개월", score: "3점", pl: 585000, cost: 3965000, label: "keep" },
    { name: "KODEX 200", hold: "9개월", score: "4점", pl: 120000, cost: 1360000, label: null },
    { name: "SK하이닉스", hold: "6개월", score: "5점", pl: 200000, cost: 750000, label: "check" },
    { name: "Apple", hold: "6개월", score: "5점", pl: 816300, cost: 2963700, label: "check", due: true },
    { name: "NVIDIA", hold: "5개월", score: "측정 중", pl: 276800, cost: 1179200, label: null },
  ];
  if (opts.loss) { // 값 주입: 합계·오래 둘 둘 다 손실 + 바꾼 선택에 전량 매도 종목(cto 4차 판정 ②③)
    const L = { "TIGER 미국S&P500": -310000, "삼성전자": -250000, "KODEX 200": -90000, "SK하이닉스": 60000, "Apple": -180000, "NVIDIA": -100000 };
    S.forEach((s) => { s.pl = L[s.name]; });
  }
  const sum = (a, k) => a.reduce((x, s) => x + s[k], 0); const pct = (p, c) => (p / c) * 100;
  const fp = (v) => `${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v).toFixed(1)}%`; const man = (w) => `${w > 0 ? "+" : w < 0 ? "−" : ""}${Math.trunc(Math.abs(w) / 10000).toLocaleString("ko-KR")}만원`;
  const tone = (v) => (v > 0 ? "mk-up" : v < 0 ? "mk-down" : "mk-muted");
  const tPl = sum(S, "pl"), tCost = sum(S, "cost"), tPct = pct(tPl, tCost);
  const keep = S.filter((s) => s.label === "keep"); const keepShare = Math.round((sum(keep, "pl") / tPl) * 100);
  const lo = 0, hi = 30; const X = (v) => ((v - lo) / (hi - lo)) * 100; const bar = (v) => `left:${X(Math.min(0, v))}%;width:${Math.max(X(Math.max(0, v)) - X(Math.min(0, v)), 0.8)}%;background:var(${v >= 0 ? "--up" : "--down"})`;
  const HOLD = [["1년 이상", ["TIGER 미국S&P500", "삼성전자"]], ["1년 미만", ["KODEX 200", "SK하이닉스", "Apple", "NVIDIA"]]].map(([g, n]) => { const ss = S.filter((s) => n.includes(s.name)); return { g, n: ss.length, pl: sum(ss, "pl"), p: pct(sum(ss, "pl"), sum(ss, "cost")) }; });
  // 돌아보기 — 고정 순서 오래 둘 → 점검할 → 바꾼 선택. %는 모두 '그날 가격부터'(정한 날 / 마지막 점검 / 바꾼 날)
  const RV = [
    { k: "오래 둘", base: "정한 날 가격부터", dot: "color-mix(in oklab, var(--foreground) 80%, transparent)", rows: [
      { name: "TIGER 미국S&P500", sub: "13개월째", st: "재확인 차례", p: 27.3 },
      { name: "삼성전자", sub: "5개월째 · 매도 1건 5주", p: 9.4 } ] },
    { k: "점검할", base: "마지막 점검 가격부터", dot: "color-mix(in oklab, var(--foreground) 45%, transparent)", rows: [
      { name: "Apple", sub: "점검 2번 · 그대로 2번", st: "점검 차례", p: 9.8 },
      { name: "SK하이닉스", sub: "아직 점검 전 · 정한 날부터", p: 8.6 } ] },
    { k: "바꾼 선택", base: "바꾼 날 가격부터", dot: "transparent; box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--foreground) 45%, transparent)", rows: [
      { name: "NVIDIA", sub: "9월 19일 정하지 않음으로", p: 8.3 }, ...(opts.loss ? [{ name: "카카오", sub: "10월 2일 정하지 않음으로", p: null }] : []) ] },
  ];
  const ICON = { trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 11h8"/><path d="M7 16h12"/><path d="M7 6h3"/></svg>', list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>', back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>', down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>', chev: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>' };
  const chip = (s) => { const ring = s.due || s.re ? " due" : ""; const t = s.label === "keep" ? "오래 둘" : s.label === "check" ? "점검할" : "이름표"; return `<span class="mk-chip${s.label ? "" : " none"}${ring}" ${ring ? `aria-label="${t}, ${s.re ? "재확인" : "점검"} 차례"` : ""}>${ring ? '<i class="mk-due-dot"></i>' : ""}${t}${ICON.down}</span>`; };
  const open = opts.open ?? null;
  const rows = S.slice(0, 5);
  root.innerHTML = `<div class="mk" data-mock="redesign4">
  <div class="mk-left">
  <section class="mk-sec" data-mk="hero">

    <div class="mk-hero-num ${tone(tPl)}"><b>${man(tPl)}</b><span>${fp(tPct)}</span></div>

      <span class="mk-muted">점검은 <b>3번</b> 했고 <b>2번</b> 그대로 뒀어요.<span class="mk-jump">돌아보기 ↓</span></span>

    </dl>

    <div class="mk-groups">
      <div class="mk-scale mk-muted" aria-hidden="true"><div></div><div><span style="left:0;transform:none">0</span><span style="left:${X(tPct)}%;color:var(--foreground);font-weight:600;background:var(--card);padding:0 3px">전체 ${fp(tPct)}</span></div><div></div></div>
      ${HOLD.map((x) => `<button class="mk-g"><span><span class="mk-g-name">${x.g}</span><span class="mk-g-sub">${x.n}종목</span></span><span class="mk-track"><span class="mk-fill" style="${bar(x.p)}"></span><span class="mk-ref" style="left:${X(tPct)}%"></span></span><span class="mk-g-val"><b class="${tone(x.p)}">${fp(x.p)}</b><span>${man(x.pl)}</span></span></button>`).join("")}
    </div>

  <section class="mk-sec" data-mk="review">
    <div class="mk-h">${ICON.back}내 선택 돌아보기 <span class="mk-i">i</span></div>

    ${RV.map((g) => `<div class="mk-rv-group" data-mk="rv-group">
      <div class="mk-rv-head"><b><i style="background:${g.dot}"></i>${g.k}</b><span>${g.base}</span></div>
      ${g.rows.map((r) => `<button class="mk-rv-row" data-mk="rv-row"><span><span class="mk-rv-name">${r.name}</span><span class="mk-sub">${r.sub}</span></span>${r.p === null ? `<span class="mk-sub" style="text-align:right;grid-column:2 / 4">지금 보유 없음</span>` : `<span class="mk-track"><span class="mk-fill" style="${bar(r.p)}"></span></span><span class="mk-rv-pct"><b class="${tone(r.p)}">${fp(r.p)}</b>${r.st ? `<span class="mk-due">${r.st}</span>` : ""}</span>`}</button>`).join("")}
    </div>`).join("")}
  </section>
  </div>
  <section class="mk-sec" data-mk="list">

      ${rows.map((s) => { const p = pct(s.pl, s.cost); const st = s.re ? "재확인 차례" : s.due ? "점검 차례" : ""; return `<div class="mk-row" role="row" data-mk="row">

        <div class="mk-c r mk-hold-col" style="justify-content:center">${s.hold}<span class="mk-sub" style="text-align:right">${s.score}</span></div>

        <div class="mk-c r pl-col"><span class="mk-pl">${man(s.pl)}</span></div>
        <div class="mk-c r">${chip(s)}</div>
      </div>${open === s.name ? `<div class="mk-card1" data-mk="card1">
        <div class="mk-facts">

          <div class="mk-fact"><span>보유 기간 대비 점수</span><b>5<span style="font-size:12px;color:var(--muted-foreground);font-weight:500"> / 5</span></b></div>
          <div class="mk-fact"><span>보유</span><b>6개월</b></div>
          <div class="mk-fact"><span>점검한 날 가격부터</span><b class="mk-up">+9.8%</b></div>
        </div>
        <div class="mk-choices"><span>그대로 둠</span><span>오래 둘로</span><span>정하지 않음</span></div>
        <div class="mk-hist"><div class="mk-hist-h">최근 선택</div>
          <div class="mk-hist-row"><i></i><span class="d">7월 16일</span><span>그대로 둠</span><span class="r">그때 산 날부터 <b class="mk-up">+10.8%</b></span></div>
          <div class="mk-hist-row"><i></i><span class="d">6월 11일</span><span>그대로 둠</span><span class="r">그때 산 날부터 <b class="mk-up">+5.4%</b></span></div>
        </div>
        <div class="mk-card1-foot"><span>최근 3개월 매매 1건 · 이 앱 기록</span><a>종목 페이지 ${ICON.chev}</a></div>
      </div>` : ""}`; }).join("")}
    </div>
    <div class="mk-more">전체 보기 ${'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>'}</div>
    <div class="mk-cycle"><span>점검 주기</span><span class="mk-muted" style="display:inline-flex;align-items:center;gap:2px">3개월 ${ICON.chev}</span></div>
  </section>
</div>`;
  return { keepShare, tPl, tPct };
}
if (document.body.classList.contains("mk-standalone")) renderMock(document.getElementById("mk-root"), Object.fromEntries(new URLSearchParams(location.search)));
</script>
