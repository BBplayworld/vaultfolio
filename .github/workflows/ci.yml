# PR마다 테스트·린트·빌드. 배포는 Vercel GitHub 연동이 담당한다.
#   - issue-<번호> 브랜치 push → Vercel preview (브랜치 고정 URL)
#   - main 머지 → Vercel production
# Settings → Branches 에서 main 보호 규칙의 필수 체크로 이 워크플로우를 지정한다.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: '{{INSTALL_CMD}}'
      - name: Test
        run: '{{TEST_CMD}}'
      - name: Lint
        run: '{{LINT_CMD}}'
      - name: Build
        run: '{{BUILD_CMD}}'
